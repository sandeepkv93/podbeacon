# This rule is not used by the project podbeacon itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the telemetry.podbeacon.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: podbeacon
    app.kubernetes.io/managed-by: kustomize
  name: telemetryprofile-editor-role
rules:
- apiGroups:
  - telemetry.podbeacon.io
  resources:
  - telemetryprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - telemetry.podbeacon.io
  resources:
  - telemetryprofiles/status
  verbs:
  - get
