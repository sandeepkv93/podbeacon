apiVersion: v1
kind: Pod
metadata:
  name: spike-sidecar-lifecycle
  namespace: demo
  annotations:
    telemetry: "enable"
spec:
  initContainers:
    - name: podbeacon-collector
      image: otel/opentelemetry-collector:0.120.0
      restartPolicy: Always
      args:
        - "--config=/conf/relay.yaml"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      startupProbe:
        httpGet:
          path: /
          port: 13133 # Default health extension port
        failureThreshold: 3
        periodSeconds: 10
      volumeMounts:
        - name: collector-config
          mountPath: /conf
          readOnly: true
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://127.0.0.1:4317"
  volumes:
    - name: collector-config
      configMap:
        name: podbeacon-config-spike
