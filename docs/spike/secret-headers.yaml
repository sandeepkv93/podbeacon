apiVersion: v1
kind: ConfigMap
metadata:
  name: podbeacon-config-spike
  namespace: demo
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 127.0.0.1:4317
          http:
            endpoint: 127.0.0.1:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 100
        spike_limit_mib: 20
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      otlp:
        endpoint: otel-gateway.observability.svc.cluster.local:4317
        tls:
          insecure: false
        headers:
          # Expanding the secret value from the environment variable mapped from the Pod
          "Authorization": "Bearer ${env:API_TOKEN}"

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]

---
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-headers-secret
  namespace: demo
type: Opaque
stringData:
  API_TOKEN: "super-secret-token-value"

---
# Pod demonstrating the secret mount as an env var
apiVersion: v1
kind: Pod
metadata:
  name: spike-secret-headers
  namespace: demo
spec:
  initContainers:
    - name: podbeacon-collector
      image: otel/opentelemetry-collector:0.120.0
      restartPolicy: Always
      args:
        - "--config=/conf/relay.yaml"
      env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: telemetry-headers-secret
              key: API_TOKEN
      volumeMounts:
        - name: collector-config
          mountPath: /conf
          readOnly: true
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
  volumes:
    - name: collector-config
      configMap:
        name: podbeacon-config-spike
